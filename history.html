<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>History - typings-io</title>
    <meta name="description" content="View your typing test history and progress" />
    <link rel="stylesheet" href="style.css" />
    <link id="theme" rel="stylesheet" href="themes/light.css" />
    <!-- Clerk SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" crossorigin="anonymous"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
      #history-container {
        width: 100%;
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      #stats-overview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .stat-card {
        padding: 1.5rem;
        border-radius: 0.4rem;
        background: #eaeaea;
        text-align: center;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
      }

      .stat-label {
        font-size: 0.9rem;
        opacity: 0.7;
      }

      #chart-container {
        background: #eaeaea;
        padding: 2rem;
        border-radius: 0.4rem;
        margin-bottom: 1rem;
      }

      #history-table-container {
        background: #eaeaea;
        padding: 1.5rem;
        border-radius: 0.4rem;
        overflow-x: auto;
      }

      #history-table {
        width: 100%;
        border-collapse: collapse;
      }

      #history-table th,
      #history-table td {
        padding: 0.8rem;
        text-align: left;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      #history-table th {
        font-weight: bold;
        opacity: 0.8;
      }

      #history-table tr:hover {
        background: rgba(0, 0, 0, 0.03);
      }

      .mode-badge {
        padding: 0.2rem 0.6rem;
        border-radius: 0.2rem;
        font-size: 0.8rem;
        display: inline-block;
      }

      .mode-wordcount {
        background: rgba(59, 130, 246, 0.2);
      }

      .mode-time {
        background: rgba(16, 185, 129, 0.2);
      }

      #loading-message {
        text-align: center;
        padding: 3rem;
        font-size: 1.2rem;
        opacity: 0.7;
      }

      #no-data-message {
        text-align: center;
        padding: 3rem;
        opacity: 0.7;
      }

      #filter-section {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .filter-button {
        padding: 0.4rem 1rem;
        border: none;
        border-radius: 0.2rem;
        cursor: pointer;
        font: inherit;
        background: #eaeaea;
      }

      .filter-button.active {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="auth-header">
      <h2 id="header">
        <a href="index.html" style="text-decoration: none; color: inherit;">typings-io</a>
      </h2>
      <div id="user-section">
        <div id="user-button" style="display: none;"></div>
      </div>
    </div>

    <div id="history-container">
      <div>
        <h2 style="margin-top: 0;">Your Typing History</h2>
        <div id="loading-message">Loading your history...</div>
        
        <div id="history-content" style="display: none;">
          <div id="stats-overview"></div>
          
          <div id="filter-section">
            <span style="align-self: center; opacity: 0.7;">Filter by mode:</span>
            <button class="filter-button active" data-filter="all">All</button>
            <button class="filter-button" data-filter="wordcount">Word Count</button>
            <button class="filter-button" data-filter="time">Time</button>
          </div>

          <div id="chart-container">
            <canvas id="history-chart"></canvas>
          </div>

          <div id="history-table-container">
            <h3 style="margin-top: 0;">Recent Tests</h3>
            <table id="history-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Mode</th>
                  <th>Count</th>
                  <th>WPM</th>
                  <th>Accuracy</th>
                </tr>
              </thead>
              <tbody id="history-table-body"></tbody>
            </table>
          </div>
        </div>

        <div id="no-data-message" style="display: none;">
          <p>No typing history yet. Complete some typing tests to see your progress here!</p>
          <a href="index.html" style="padding: 0.6rem 1.2rem; border-radius: 0.2rem; background: #eaeaea; text-decoration: none; color: inherit; display: inline-block; margin-top: 1rem;">
            Start Typing
          </a>
        </div>
      </div>
    </div>

    <div id="footer">
      <a href="index.html">back to test</a>/
      <a href="https://github.com/briano1905/typings#typings" target="_blank">user guide</a>
    </div>

    <script src="clerk-init.js"></script>
    <script src="history.js"></script>
  </body>
</html>
